name: Concurrency test

# Manual only: a thousand simultaneous bookings is a load test, not
# something to run on every push.
on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Number of simultaneous booking requests"
        required: true
        default: "1000"

permissions:
  contents: read

concurrency:
  group: concurrency-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  concurrency:
    name: concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
      PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
      CONCURRENCY: ${{ inputs.concurrency }}
    steps:
      - name: Check the input and the test project
        run: |
          if ! [[ "$CONCURRENCY" =~ ^[0-9]+$ ]] || [ "$CONCURRENCY" -lt 2 ] || [ "$CONCURRENCY" -gt 5000 ]; then
            echo "::error::concurrency must be a whole number between 2 and 5000"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::TEST_SUPABASE_* secrets are not set"
            exit 1
          fi
          if [ -n "$PRODUCTION_SUPABASE_URL" ] && [ "$NEXT_PUBLIC_SUPABASE_URL" = "$PRODUCTION_SUPABASE_URL" ]; then
            echo "::error::TEST_SUPABASE_URL points at the production project - refusing to run."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply migrations to the test project
        if: env.SUPABASE_DB_URL != ''
        run: npx --yes supabase@2.122.0 db push --yes --db-url "$SUPABASE_DB_URL"
      - run: npm run test:concurrency
