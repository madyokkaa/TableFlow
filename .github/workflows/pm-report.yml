name: PM weekly report

# Weekly status report from GitHub data. Numbers are computed by
# tools/pm_report.py; the model only words the text around them.
# Manual runs: Actions -> PM weekly report -> Run workflow.
on:
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC = 09:00 Asia/Almaty
  workflow_dispatch:
    inputs:
      since:
        description: "Period start, YYYY-MM-DD (empty = last 7 days)"
        required: false
      until:
        description: "Period end inclusive, YYYY-MM-DD"
        required: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: pm-report
  cancel-in-progress: false

jobs:
  report:
    name: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SINCE: ${{ inputs.since }}
      UNTIL: ${{ inputs.until }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: python3 -m pip install --quiet requests
      - name: Build report
        run: |
          args=(--repo "$GITHUB_REPOSITORY")
          if [ -n "$SINCE" ]; then
            [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::bad since"; exit 1; }
            args+=(--since "$SINCE")
          fi
          if [ -n "$UNTIL" ]; then
            [[ "$UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::bad until"; exit 1; }
            args+=(--until "$UNTIL")
          fi
          python3 tools/pm_report.py "${args[@]}"
      - name: Summary
        if: always()
        run: cat reports/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report produced." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pm-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
